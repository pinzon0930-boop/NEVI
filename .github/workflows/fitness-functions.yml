name: Fitness Functions — Seguridad y Arquitectura

# Se ejecuta en cada Pull Request y en cada push a main.
# Si alguna regla se viola, el PR no puede mergearse.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  architecture-fitness:
    name: "Verificar reglas de arquitectura (ArchUnit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compilar el proyecto
        run: |
          cd backend
          mvn compile -q

      - name: "🏗️ Ejecutar fitness functions de arquitectura"
        run: |
          cd backend
          mvn test -Dtest=NeviSecurityArchitectureTest -q
        # Si alguna regla falla, Maven sale con código 1 → el job falla → el PR queda bloqueado

      - name: Publicar reporte de resultados
        if: failure()
        run: |
          echo "❌ Una o más reglas de arquitectura fueron violadas."
          echo ""
          echo "Reglas que se verifican:"
          echo "  1. Endpoints en paquete .admin. deben tener @PreAuthorize"
          echo "     → Protege contra: Elevación de Privilegios (STRIDE E, OWASP A01)"
          echo ""
          echo "  2. Controllers no deben acceder a repositorios directamente"
          echo "     → Protege contra: IDOR por saltar verificación de ownership"
          echo ""
          echo "  3. Servicios no deben depender de clases HTTP"
          echo "     → Protege contra: lógica de negocio acoplada al protocolo"
          echo ""
          echo "  4. Capa de seguridad no depende de servicios de negocio"
          echo "     → Protege contra: dependencias circulares en JwtAuthFilter"
          echo ""
          echo "Ver el log del step anterior para el detalle exacto de qué regla falló."

  security-scan:
    name: "Buscar credenciales en el código (Semgrep)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: "🔍 Scan de credenciales hardcodeadas"
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/secrets
            p/java
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        # Si encuentra un secreto hardcodeado (password, API key, etc.), falla el job
        # Esto implementa el control del checklist: "CI detecta credenciales antes del merge"
        continue-on-error: true  # En modo académico: aviso pero no bloquea
        # Cambiar a continue-on-error: false para modo estricto

      - name: "🔍 Verificar que .env no está en el commit"
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ ERROR CRÍTICO: El archivo .env está siendo trackeado por Git."
            echo "Esto expone credenciales sensibles en el repositorio."
            echo ""
            echo "Para solucionar:"
            echo "  1. git rm --cached .env"
            echo "  2. Agregar .env a .gitignore"
            echo "  3. ROTAR TODAS LAS CREDENCIALES inmediatamente"
            echo "     (Borrar el commit NO es suficiente — el historial conserva el archivo)"
            exit 1
          else
            echo "✅ .env no está trackeado por Git"
          fi

      - name: "🔍 Verificar que no hay passwords en application.yml"
        run: |
          if grep -rn "password\s*=\s*['\"][^$\{]" backend/src/main/resources/ 2>/dev/null; then
            echo "❌ Posible credencial hardcodeada en archivos de configuración"
            echo "Las credenciales deben estar en variables de entorno (\${DB_PASSWORD})"
            exit 1
          else
            echo "✅ No se encontraron credenciales hardcodeadas en resources/"
          fi

  notify-violation:
    name: "Resumen de violaciones"
    runs-on: ubuntu-latest
    needs: [architecture-fitness, security-scan]
    if: failure()

    steps:
      - name: Resumen de qué regla se violó
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  NEVI — Fitness Functions: VIOLACIÓN DETECTADA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Este PR no puede mergearse hasta que se corrijan las violaciones."
          echo ""
          echo "  Para ver el detalle exacto:"
          echo "  → Ir a la pestaña 'Actions' en GitHub"
          echo "  → Abrir este workflow"
          echo "  → Ver el job que falló y expandir el step con ❌"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
