name: CI — NOVI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    name: Backend — Compilar y probar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nevi_test
          POSTGRES_USER: nevi
          POSTGRES_PASSWORD: nevi_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas
        working-directory: backend
        run: mvn test --batch-mode

      - name: Build del JAR
        working-directory: backend
        run: mvn package -DskipTests --batch-mode

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build del frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080
          VITE_WS_URL: ws://localhost:8080/ws
          VITE_GROQ_API_KEY: placeholder-ci-key
        run: npm run build

  docker-compose-smoke:
    name: Docker Compose — Smoke test
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear .env para CI
        run: |
          cat > .env << 'ENVEOF'
          DB_NAME=nevi_ci
          DB_USER=nevi
          DB_PASSWORD=nevi_ci_pass
          JWT_SECRET=ci-jwt-secret-key-32-characters-min
          VITE_API_URL=http://localhost:8080
          VITE_WS_URL=ws://localhost:8080/ws
          VITE_GROQ_API_KEY=placeholder-ci-key
          ENVEOF

      - name: Levantar stack con Docker Compose
        run: docker compose up --build -d

      - name: Esperar a que el backend esté listo
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Backend listo"
              break
            fi
            echo "Intento $i — esperando backend..."
            sleep 5
          done

      - name: Verificar frontend
        run: curl -sf http://localhost | grep -qi "NOVI" && echo "Frontend OK"

      - name: Apagar stack
        if: always()
        run: docker compose down -v
