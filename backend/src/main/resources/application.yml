server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nevi}
    username: ${DB_USER:nevi}
    password: ${DB_PASSWORD:nevi}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false  # LocalDateTime → ISO string, no arrays

  jpa:
    hibernate:
      ddl-auto: update          # Crea/actualiza tablas automáticamente al arrancar
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Permite que CORS y WebSocket funcionen sin conflictos
  web:
    cors:
      allowed-origins: "*"

nevi:
  jwt:
    secret: ${JWT_SECRET:nevi-super-secret-key-change-in-production-2024}
    expiration-ms: 86400000    # 24 horas en milisegundos

logging:
  level:
    com.nevi: DEBUG
    org.springframework.security: WARN
